# Veröffentlicht dieses Repo als Ausweichquelle auf GitHub Pages.
#
# Warum es diese Datei gibt: Bis zum 06.08.2026 lief die Veröffentlichung über den
# eingebauten „legacy"-Bauweg, den GitHub abschafft. Der schlug ab 10:49 Uhr
# reproduzierbar fehl — `status: errored`, `duration: 0`, Meldung nur „Page build
# failed". Der Repo-Inhalt war dabei jedes Mal korrekt; nur die Veröffentlichung kam
# nie an. Ausgeschlossen wurden: Symlinks, fehlende `.nojekyll`, Repo-Größe, privates
# Repo. Der Weg über Actions umgeht den alten Bauweg vollständig und sagt im
# Fehlerfall, was los ist, statt einen leeren Fehler zu melden.
#
# Hier wird NICHTS gebaut. Das Repo ist ein reines Dateilager: `release-cdn.sh` legt
# die fertigen Dateien ab und schiebt sie hierher. Der Lauf lädt den Baum unverändert
# hoch.

name: Ausweichquelle veröffentlichen

on:
  push:
    branches: [main]
  # Von Hand anstoßbar — nützlich, um ohne neue Auslieferung nachzuprüfen,
  # ob die Veröffentlichung wieder läuft.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läufe nicht abbrechen: Jede Auslieferung soll ankommen. Bricht man den laufenden
# ab, kann die Ausweichquelle auf einem älteren Stand stehenbleiben — genau der
# Zustand, den diese Datei beheben soll.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Dateibaum als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Auf Pages ausliefern
        id: veroeffentlichen
        # Der Fehlschlag dieses Schrittes beendet den Lauf NICHT.
        #
        # Grund, am 06.08.2026 vier Mal beobachtet: Der Schritt wartet darauf, dass
        # GitHub die Auslieferung als „fertig" meldet — und diese Meldung kommt für
        # dieses Repo nie. Sie bleibt auf `deployment_in_progress` stehen, bis der
        # Schritt aufgibt und abbricht („Canceling Pages deployment"). Der Inhalt ist
        # dabei jedes Mal trotzdem oeffentlich gelandet, nachweislich byte-identisch
        # mit dem Hauptserver.
        #
        # Länger warten geht nicht: Ein Versuch mit 30 Minuten wurde stillschweigend
        # gekappt — „timeout value is greater than the allowed maximum, timeout set to
        # the maximum of 600000 milliseconds". Zehn Minuten sind das harte Maximum
        # dieser Aktion. Gegen einen Status, der nie umspringt, ist damit kein Kraut
        # gewachsen.
        #
        # Statt der Statusmeldung entscheidet deshalb der Schritt darunter — der sieht
        # nach, was unter der oeffentlichen Adresse wirklich liegt. Das ist ohnehin die
        # ehrlichere Frage.
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Nachprüfen, was wirklich ausgeliefert wird
        # Dieser Schritt entscheidet über Erfolg oder Fehlschlag des Laufs — nicht die
        # Statusmeldung von GitHub. Er ist der eigentliche Zweck des Ganzen: nicht
        # melden, sondern nachsehen. Der frühere Fehler blieb wochenlang unbemerkt,
        # weil niemand geprüft hat, was am Ende tatsächlich unter der Adresse liegt.
        #
        # ⚠️ ER HAT ES BIS ZUM 17.08.2026 TROTZDEM NICHT GEKONNT — er sah am falschen
        # Ort nach. Hier stand hart `v1/version.json`, während die Bibliothek längst
        # auf v2 ausgeliefert wird. v1 ist eingefroren, also stimmten Repo und
        # Ausweichquelle dort auf 1.12.0 überein, und der Schritt meldete beim ersten
        # Versuch Erfolg. Gemessen an dem Tag:
        #
        #   v1  Repo 1.12.0 · Ausweich 1.12.0 · Hauptserver 1.12.0   ← geprüft, stimmt
        #   v2  Repo 2.5.2  · Ausweich 2.5.1  · Hauptserver 2.5.2    ← NICHT geprüft
        #
        # Der Lauf zur Auslieferung 2.5.2 (18:24 Uhr) stand deshalb auf „success",
        # während die Ausweichquelle eine Fassung zurückhing — samt eines Fehlers im
        # Wochendiagramm, den 2.5.2 gerade behoben hatte. Ein Wächter, der eine feste
        # Fassungsnummer kennt, wird beim nächsten Hauptsprung wieder blind. Deshalb
        # prüft er jetzt JEDEN Baum, der im Repo liegt.
        #
        # Läuft auch, wenn das Ausliefern „fehlgeschlagen" ist — genau dann ist die
        # Frage ja interessant.
        if: always()
        run: |
          set -euo pipefail
          BASIS="https://shx-solutions.github.io/shx-ui-cdn"

          # Alle Versionsbäume, die im Repo liegen — nicht der eine, der mal der
          # richtige war. Kommt eines Tages v3 dazu, ist es ohne Zutun mit dabei.
          shopt -s nullglob
          OFFEN=()
          for datei in v*/version.json; do OFFEN+=("$(dirname "$datei")"); done
          shopt -u nullglob

          if [ "${#OFFEN[@]}" -eq 0 ]; then
            echo "::error::Kein einziger v*/version.json im Repo. Entweder hat das Ablegen"
            echo "::error::nicht funktioniert, oder die Ordnerstruktur hat sich geändert —"
            echo "::error::in beiden Fällen darf dieser Lauf nicht grün sein."
            exit 1
          fi
          echo "Zu prüfen: ${OFFEN[*]}"

          version_live() {
            curl -sf "$BASIS/$1/version.json?t=$RANDOM$RANDOM" 2>/dev/null \
              | node -p "try{JSON.parse(require('fs').readFileSync(0)).version}catch(e){''}" 2>/dev/null || true
          }

          for versuch in $(seq 1 20); do
            NOCH_OFFEN=()
            for baum in "${OFFEN[@]}"; do
              SOLL="$(node -p "require('./$baum/version.json').version")"
              IST="$(version_live "$baum")"
              if [ "$IST" = "$SOLL" ]; then
                echo "  ✓ $baum liefert $SOLL"
              else
                echo "  · $baum liefert '${IST:-nichts}', erwartet $SOLL"
                NOCH_OFFEN+=("$baum")
              fi
            done
            OFFEN=("${NOCH_OFFEN[@]+"${NOCH_OFFEN[@]}"}")
            if [ "${#OFFEN[@]}" -eq 0 ]; then
              echo "Ausweichquelle vollständig auf dem Stand des Repos."
              exit 0
            fi
            if [ "$versuch" -lt 20 ]; then
              echo "  Versuch $versuch — warte 15 s"
              sleep 15
            fi
          done

          # Kein „warnen und trotzdem grün": Eine Ausweichquelle, die eine alte Fassung
          # ausliefert, ist schlimmer als gar keine — sie springt genau dann ein, wenn
          # der Hauptserver weg ist, und bringt dann leise alte Fehler zurück.
          for baum in "${OFFEN[@]}"; do
            echo "::error::$baum: Ausweichquelle liefert nach 5 Minuten nicht $(node -p "require('./$baum/version.json').version"). Lauf erneut anstoßen (Actions → „Ausweichquelle veröffentlichen\" → Run workflow); das hat am 17.08.2026 gereicht."
          done
          exit 1
